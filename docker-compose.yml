# Dung app + PostgreSQL bang 1 lenh: docker compose up --build
# App chay profile "postgres" -> Flyway tao schema (V1..V3) trong Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_PASSWORD: shop123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shop123
      # Production: dat secret that o day (vd qua .env hoac CI secret).
      APP_JWT_SECRET: Z2hpLW5oby1iaS1tYXQtZGFpLWl0LW5oYXQtMzItYnl0ZS1jaG8tSFMyNTYtb2tlLW5oZQ==
    ports:
      - "8080:8080"
