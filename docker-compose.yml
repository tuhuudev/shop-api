# Dung app + PostgreSQL + Redis bang 1 lenh: docker compose up --build
# Postgres-only: Flyway tao schema (V1..V4). Redis: cache + rate-limit + login-attempts.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_PASSWORD: shop123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shop123
      SPRING_DATA_REDIS_HOST: redis
      # JWT dung khoa RS256 dev nam san trong image (classpath keys/*.pem).
      # Production: mount secret va override APP_JWT_PRIVATE_KEY / APP_JWT_PUBLIC_KEY (file:/...).
    ports:
      - "8080:8080"
