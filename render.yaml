# ============================================================
# Render Blueprint - host shop-api free (Docker) + auto-deploy khi push main.
# Postgres dung Neon (free), Redis dung Upstash (free) - khai bao connection string qua env.
# Tao service: Render Dashboard -> New -> Blueprint -> tro toi repo nay.
# Chi tiet tung buoc: docs/DEPLOY.md
# ============================================================
services:
  - type: web
    name: shop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore            # gan VN nhat trong cac region free
    branch: main
    autoDeploy: true             # push main -> Render tu build + deploy (CD)
    # Liveness: chi kiem app con song (khong gom DB/Redis) -> tranh restart khi DB/Redis chop nhoang.
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # JVM ton trong RAM container 512MB (free).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0

      # --- PostgreSQL (Neon) - dat trong Dashboard (sync:false). URL phai co ?sslmode=require ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # --- Redis - host/port/password dat trong Dashboard (sync:false).
      # TLS: KHONG ep o day. App mac dinh SSL=false (Redis Cloud free dung redis:// khong TLS).
      # Neu Redis co TLS (rediss://, vd Upstash) -> them env SPRING_DATA_REDIS_SSL_ENABLED=true. ---
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false

      # Khoa RS256 dev duoc BAKE vao image luc build (xem Dockerfile) -> dung classpath mac dinh,
      # KHONG can Secret Files. (Demo: redeploy se sinh khoa moi -> token cu het han.)

      # --- Secret webhook thanh toan: Render tu sinh ngau nhien (xem o Dashboard de test) ---
      - key: APP_PAYMENTS_WEBHOOK_SECRET
        generateValue: true

      # --- CORS: origin that cua frontend (vd https://shop-client.example.com) ---
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
