spring.application.name=shop-api

# ============================================================
# DATABASE: H2 (in-memory) - chay ngay, khong can cai dat
# Du lieu se mat khi tat app. Khi nao muon luu vinh vien,
# chuyen sang PostgreSQL (xem CLAUDE.md muc "Chuyen sang Postgres").
# ============================================================
spring.datasource.url=jdbc:h2:mem:shopdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mo H2 web console tai http://localhost:8080/h2-console
# JDBC URL phai go dung: jdbc:h2:mem:shopdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
# create-drop = tu tao bang khi khoi dong, xoa khi tat
spring.jpa.hibernate.ddl-auto=create-drop
# In ra cau lenh SQL that su chay (rat huu ich de HOC SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tat "open session in view" - dong session DB ngay sau service (thuc hanh tot).
# Viec map Entity -> DTO cua ta deu nam trong @Transactional nen an toan.
spring.jpa.open-in-view=false

# CHONG N+1 QUERY: khi nap lazy (vi du items cua nhieu don, product cua nhieu item),
# Hibernate gom lai thanh vai cau IN(...) thay vi 1 cau cho moi dong.
# Vd liet ke 20 don: thay vi ~40+ query -> chi con vai query. Giu phan trang dung.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# CHAN LAM DUNG PHAN TRANG: gioi han size toi da client duoc yeu cau (tranh ?size=1000000).
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ============================================================
# FLYWAY: o profile dev (H2) TAT Flyway, dung create-drop + DataSeeder cho nhanh.
# Khi chay profile "postgres" se bat Flyway (xem application-postgres.properties).
# ============================================================
spring.flyway.enabled=false

# ============================================================
# JWT: khoa bi mat de KY token + thoi han song cua token.
# - secret PHAI du dai (>= 32 byte) cho thuat toan HS256.
# - Doc tu BIEN MOI TRUONG APP_JWT_SECRET (an toan: KHONG commit secret that len Git).
#   Neu khong set bien, dung gia tri mac dinh ben duoi - CHI dung cho dev/local.
#   Production: set APP_JWT_SECRET (vi du trong PowerShell: $env:APP_JWT_SECRET="<base64 32+ byte>").
# ============================================================
app.jwt.secret=${APP_JWT_SECRET:Z2hpLW5oby1iaS1tYXQtZGFpLWl0LW5oYXQtMzItYnl0ZS1jaG8tSFMyNTYtb2tlLW5oZQ==}
# Issuer: ai phat hanh token (dat va kiem tra de tu choi token tu nguon khac).
app.jwt.issuer=shop-api
# Access token song ngan (15 phut), Refresh token song dai (7 ngay). Don vi: mili giay.
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ============================================================
# Chong do mat khau (brute-force): khoa dang nhap sau N lan sai trong 1 cua so thoi gian.
# ============================================================
app.security.login.max-attempts=5
app.security.login.block-minutes=15

# ============================================================
# CORS: danh sach origin duoc phep goi API tu trinh duyet (cach nhau dau phay).
# De trong = khong cho phep cross-origin (an toan mac dinh). Vi du dev frontend:
#   app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
# ============================================================
app.cors.allowed-origins=

# ============================================================
# LOGGING: muc log goi gang. RequestLoggingFilter cua ta log o muc INFO.
# ============================================================
logging.level.com.learn.shopapi=INFO
# Hien correlationId (dat trong MDC) o moi dong log de truy vet 1 request.
logging.pattern.level=%5p [%X{correlationId}]

# ============================================================
# ACTUATOR (observability): chi mo health + info ra ngoai.
# /actuator/health cong khai (cho load balancer kiem tra song/chet);
# cac endpoint khac duoc bao ve (xem SecurityConfig - yeu cau ADMIN).
# show-details=when_authorized: chi nguoi du quyen moi thay chi tiet health.
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# ============================================================
# CACHE (Caffeine): cache "categories" toi da 200 muc, het han sau 10 phut.
# ============================================================
spring.cache.cache-names=categories
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m
