spring.application.name=shop-api

# Cong HTTP: mac dinh 8080 (dev/docker compose). PaaS (Render/Heroku...) inject PORT -> bind theo do.
server.port=${PORT:8080}

# ============================================================
# DATABASE: PostgreSQL (Postgres-only). Dev chay DB qua docker compose:
#   docker compose up -d db
# Ghi de qua bien moi truong SPRING_DATASOURCE_* o compose/k8s.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shop123}

# JPA / Hibernate
# validate = Hibernate CHI kiem tra entity khop schema; Flyway SO HUU schema (db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tat "open session in view" - dong session DB ngay sau service (thuc hanh tot).
# Viec map Entity -> DTO cua ta deu nam trong @Transactional nen an toan.
spring.jpa.open-in-view=false

# CHONG N+1 QUERY: khi nap lazy (vi du items cua nhieu don, product cua nhieu item),
# Hibernate gom lai thanh vai cau IN(...) thay vi 1 cau cho moi dong.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# CHAN LAM DUNG PHAN TRANG: gioi han size toi da client duoc yeu cau (tranh ?size=1000000).
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Flyway LUON bat: cac script db/migration so huu schema (V1..V9).
spring.flyway.enabled=true

# Hikari pool: gioi han ket noi DB (tranh can kiet) + timeout hop ly.
# LUU Y multi-instance/k8s: tong ket noi = (so replica) x max-pool-size phai <= Postgres max_connections.
# Chinh max qua env DB_POOL_MAX_SIZE theo so pod thuc te.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Graceful shutdown: ngung nhan request moi, cho request dang chay xong (toi da 30s) roi tat.
# Quan trong khi rolling-update tren k8s (khong cat ngang request dang xu ly).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================================
# JWT RS256 (RSA bat doi xung): ky bang private key, verify bang public key.
# - Khoa dev nam o classpath (keys/*.pem) - tien chay local.
# - Production: tro toi secret that qua bien moi truong (file mount), vi du:
#     APP_JWT_PRIVATE_KEY=file:/run/secrets/jwt-private.pem
#     APP_JWT_PUBLIC_KEY=file:/run/secrets/jwt-public.pem
#   KHONG commit private key that len Git.
# ============================================================
app.jwt.private-key=${APP_JWT_PRIVATE_KEY:classpath:keys/jwt-private.pem}
app.jwt.public-key=${APP_JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}
# Issuer: ai phat hanh token (dat va kiem tra de tu choi token tu nguon khac).
app.jwt.issuer=shop-api
# Access token song ngan (15 phut), Refresh token song dai (7 ngay). Don vi: mili giay.
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ============================================================
# COOKIE chua refresh token (httpOnly). Xem RefreshTokenCookie.
# - secure=false cho DEV (HTTP). PRODUCTION (HTTPS) phai dat secure=true.
# - same-site=Lax du cho same-site (dev qua Vite proxy). Neu client va API KHAC domain
#   (cross-site that su) -> dat same-site=None VA secure=true (bat buoc).
# ============================================================
app.auth.cookie.name=refresh_token
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# ============================================================
# Chong do mat khau (brute-force): khoa dang nhap sau N lan sai trong 1 cua so thoi gian.
# ============================================================
app.security.login.max-attempts=5
app.security.login.block-minutes=15

# ============================================================
# Rate limit theo IP cho endpoint xac thuc (RateLimitFilter).
# Chan credential-stuffing/dang ky spam tu 1 IP (bo sung cho khoa-theo-username).
# Luu y: sau Vite proxy o dev, backend thay IP cua proxy (127.0.0.1) cho moi client.
# ============================================================
app.security.ratelimit.enabled=true
app.security.ratelimit.auth-per-minute=30

# ============================================================
# Cache UserDetails (don bay perf cho JwtAuthenticationFilter - xem CustomUserDetailsService).
# 0 = TAT (mac dinh an toan): nap lai user tu DB moi request -> thu hoi quyen/khoa user TUC THI.
# > 0 = cache N giay: giam tai DB nhung thu hoi/doi quyen tre toi da N giay.
# ============================================================
app.security.userdetails-cache-seconds=0

# ============================================================
# CORS: danh sach origin duoc phep goi API tu trinh duyet (cach nhau dau phay).
# De trong = khong cho phep cross-origin (an toan mac dinh). Vi du dev frontend:
#   app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
# Dev client (shop-client) chay bang Vite, cong 5173 (hoac 5174/5175 neu cong ban).
# Trinh duyet luon gui header Origin -> phai cho phep o day, neu khong se bi 403 "Invalid CORS request".
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173

# ============================================================
# LOGGING: muc log goi gang. RequestLoggingFilter cua ta log o muc INFO.
# ============================================================
logging.level.com.learn.shopapi=INFO
# Hien traceId/spanId (do Micrometer Tracing dat vao MDC) o moi dong log de truy vet xuyen request.
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]

# ============================================================
# ACTUATOR (observability): chi mo health + info ra ngoai.
# /actuator/health cong khai (cho load balancer kiem tra song/chet);
# cac endpoint khac duoc bao ve (xem SecurityConfig - yeu cau ADMIN).
# show-details=when_authorized: chi nguoi du quyen moi thay chi tiet health.
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
# k8s probes: tach liveness (con song?) va readiness (san sang nhan traffic?).
# readiness gom db + redis -> pod bi danh dau NOT READY khi mat DB/Redis (k8s ngung dua traffic).
management.endpoint.health.probes.enabled=true
# redisReadiness = round-trip write+read (kiem ghi/doc that, khong chi TCP/PING nhu auto "redis").
management.endpoint.health.group.readiness.include=readinessState,db,redis,redisReadiness

# ============================================================
# OBSERVABILITY: metrics tags + tracing (Micrometer/OpenTelemetry).
# - Tag chung "application" cho moi metric (de loc tren Prometheus/Grafana).
# - sampling=1.0 cho dev (lay tat ca trace). Prod giam (xem application-prod).
# - OTLP endpoint de TRONG o dev (khong xuat); prod tro toi collector qua bien moi truong.
# ============================================================
management.metrics.tags.application=shop-api
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}

# ============================================================
# REDIS: state phan tan (rate-limit, login-attempts, idempotency) + cache - chia se giua replica.
# Dev chay Redis qua docker compose (service "redis"); ghi de qua SPRING_DATA_REDIS_* o prod.
# PROD: dat password (SPRING_DATA_REDIS_PASSWORD) va bat TLS (SPRING_DATA_REDIS_SSL_ENABLED=true)
# neu Redis di qua mang khong tin cay - Redis dang giu ca idempotency/rate-limit/login-attempt.
# ============================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}

# CACHE qua Redis: @Cacheable("categories") het han sau 10 phut.
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
