# ============================================================
# PROFILE "prod": hardening cho moi truong that (chay SAU HTTPS/TLS).
# Bat bang: --spring.profiles.active=prod (Postgres da la mac dinh, khong con profile "postgres").
# Tach rieng de chay local-qua-HTTP ma khong bi vo cookie (Secure cookie bi bo qua tren HTTP).
# ============================================================

# Cookie refresh token: BAT BUOC Secure tren HTTPS.
# - Frontend CUNG domain backend (cau hinh hien tai): Strict chong CSRF triet de cho /refresh,
#   /logout (cookie KHONG gui kem trong moi request cross-site) - khong can CSRF token.
# - Neu sau nay tach KHAC domain (cross-site): doi same-site=None (kem Secure=true) VA them
#   double-submit CSRF token cho cac endpoint cookie-based, vi None khong con chan CSRF.
app.auth.cookie.secure=true
app.auth.cookie.same-site=Strict

# Sau reverse-proxy terminate TLS (nginx/ALB): tin X-Forwarded-Proto/Host de Spring
# biet request goc la HTTPS -> Secure cookie + HSTS moi phat huy, redirect/URL dung scheme.
server.forward-headers-strategy=framework

# CORS: dat origin THAT cua frontend qua bien moi truong (khong hard-code, khong wildcard).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ENV BAT BUOC o prod (app fail-fast / khong an toan neu thieu):
#  - APP_PAYMENTS_WEBHOOK_SECRET : secret ky webhook thanh toan (PaymentService chan boot neu rong/dev).
#  - SPRING_DATASOURCE_PASSWORD  : mat khau DB (dung default dev = lo).
#  - SPRING_DATA_REDIS_PASSWORD  : neu Redis co AUTH (nen co). SPRING_DATA_REDIS_SSL_ENABLED=true neu can TLS.
#  - APP_JWT_PRIVATE_KEY / APP_JWT_PUBLIC_KEY : khoa RS256 that (file mount), KHONG dung khoa classpath.
app.payments.webhook-secret=${APP_PAYMENTS_WEBHOOK_SECRET:}

# Giam lo thong tin & on ao o prod
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never

# Observability prod: log JSON (ECS) cho log aggregator; sampling thap; OTLP tro collector qua env.
logging.structured.format.console=ecs
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
