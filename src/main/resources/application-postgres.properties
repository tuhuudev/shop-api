# ============================================================
# PROFILE "postgres": chay voi PostgreSQL that + Flyway quan ly schema.
# Bat bang cach: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=postgres"
# Truoc do can co 1 container Postgres (xem README muc PostgreSQL):
#   docker run --name shop-pg -e POSTGRES_PASSWORD=shop123 -e POSTGRES_DB=shopdb -p 5432:5432 -d postgres:16
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=shop123

# Flyway SO HUU schema: cac file SQL trong db/migration tao bang.
# ddl-auto=none: Hibernate KHONG tao/sua/kiem tra schema - tin tuong hoan toan vao Flyway.
# (Co the doi thanh "validate" neu muon Hibernate kiem tra entity khop bang, nhung kieu
#  du lieu phai trung khop tuyet doi voi DDL.)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# Tat H2 console o moi truong "that"
spring.h2.console.enabled=false

# Van in SQL de tien theo doi khi hoc
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
