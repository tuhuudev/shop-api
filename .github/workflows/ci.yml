name: CI

# Chay khi push hoac mo pull request len nhanh chinh.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile + test (unit/integration/ArchUnit) + Checkstyle + Enforcer.
      - name: Build & verify
        run: ./mvnw -B verify
